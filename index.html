<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #ede5d4; color: #1a1611;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#net { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 50%, rgba(237, 229, 212, 0.7) 100%);
    }
    .wordmark {
      position: fixed; top: 32px; left: 40px;
      font-size: 12px; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(60, 48, 24, 0.85);
      font-weight: 500; z-index: 3;
    }
    main {
      position: relative; z-index: 2;
      min-height: 100vh; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: flex-end;
      align-items: flex-start; padding: 0 8vw 14vh;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(36px, 6vw, 80px);
      line-height: 1.05;
      letter-spacing: -0.015em;
      margin: 0 0 0.7em 0;
      color: #14110b;
      max-width: 16ch;
    }
    h1 .accent { color: #b8860b; }
    p.thesis {
      max-width: 50ch;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.65;
      color: rgba(40, 35, 25, 0.78);
      margin: 0;
    }
    footer {
      position: fixed; bottom: 32px; right: 40px;
      font-size: 12px; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(60, 48, 24, 0.6);
      z-index: 3;
    }
    @media (max-width: 720px) {
      .wordmark { top: 22px; left: 24px; font-size: 11px; letter-spacing: 0.2em; }
      footer { bottom: 22px; right: 24px; left: 24px; text-align: right; font-size: 11px; letter-spacing: 0.2em; }
      main { padding: 0 7vw 11vh; }
      h1 { font-size: clamp(30px, 9vw, 56px); max-width: 14ch; line-height: 1.08; }
      p.thesis { font-size: 14px; line-height: 1.6; }
    }
    @media (max-width: 420px) {
      main { padding: 0 6vw 10vh; }
      h1 { font-size: clamp(28px, 10vw, 44px); }
    }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="vignette"></div>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <h1>Reinventing <span class="accent">super</span>intelligence</h1>
    <p class="thesis">
      Knowledge is not intelligence. Today's models memorize. They do not adapt. We are building intelligence as what it actually is &mdash; a dynamical process, not a function. Native adaptive reasoning, memory, and self-correction.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>

  <script>
    (function () {
      const canvas = document.getElementById('net');
      const ctx = canvas.getContext('2d');

      const PALETTE = {
        bg:        '#ede5d4',
        edge:      'rgba(60, 48, 24, 0.18)',
        trail0:    'rgba(180, 110, 30, 0)',
        trail1:    'rgba(180, 110, 30, 0.45)',
        trail2:    'rgba(150,  80, 20, 0.90)',
        spikeHead: 'rgba(120,  60, 10, 0.95)',
        glow: [
          [0.00, 'rgba(255, 220, 130, 0.95)'],
          [0.18, 'rgba(255, 180,  60, 0.55)'],
          [0.50, 'rgba(255, 180,  60, 0.16)'],
          [1.00, 'rgba(255, 180,  60, 0.0)'],
        ],
        nodeFill:   'rgba(80, 60, 30, 0.78)',
        nodeStroke: 'rgba(120, 90, 40, 0.95)',
        inputFill:  'rgba(40, 80, 130, 0.75)',
        inputStroke:'rgba(50, 100, 160, 0.95)',
        compBlend:  'lighter',
      };
      runSpikeNetwork(canvas, ctx, PALETTE);
    })();

    function runSpikeNetwork(canvas, ctx, P) {
      let w, h, dpr;
      const N_NODES = 38, NEAR_K = 3, TRAVEL = 0.55;
      const FIRE_DECAY = 0.34, SPONT_RATE = 0.22;
      const PROP = 0.55, MAX_DEPTH = 5;

      const GLOW_SIZE = 256;
      const glowSprite = (() => {
        const off = document.createElement('canvas');
        off.width = GLOW_SIZE; off.height = GLOW_SIZE;
        const gc = off.getContext('2d');
        const cx = GLOW_SIZE / 2;
        const grad = gc.createRadialGradient(cx, cx, 0, cx, cx, cx);
        for (const [s, c] of P.glow) grad.addColorStop(s, c);
        gc.fillStyle = grad;
        gc.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);
        return off;
      })();

      let nodes = [], edges = [], spikes = [];

      // Graph topology is built once. Node positions are stored in normalized
      // [0,1] coords (nx, ny) and edge curvature in a viewport-relative
      // ctrlNorm; resize just remaps to pixels via updateScreenPositions().
      function buildGraph() {
        nodes = [];
        for (let i = 0; i < N_NODES; i++) {
          nodes.push({
            nx: Math.random(), ny: Math.random(),
            x: 0, y: 0,
            r: 5 + Math.random() * 2.5,
            role: Math.random() < 0.18 ? 'input' : 'inner',
            fires: [], nextFire: 0.5 + Math.random() * 6, outE: [],
          });
        }
        edges = [];
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          const others = nodes
            .map((n, j) => ({ j, d2: (n.nx - a.nx) ** 2 + (n.ny - a.ny) ** 2 }))
            .filter(o => o.j !== i)
            .sort((x, y) => x.d2 - y.d2)
            .slice(0, NEAR_K + Math.floor(Math.random() * 2));
          for (const o of others) {
            if (Math.random() < 0.55) {
              const e = { src: i, dst: o.j, ctrlNorm: (Math.random() - 0.5) * 0.05, ctrl: 0 };
              edges.push(e);
              a.outE.push(edges.length - 1);
            }
          }
        }
      }

      function updateScreenPositions() {
        for (const n of nodes) {
          n.x = n.nx * w;
          n.y = n.ny * h;
        }
        const minDim = Math.min(w, h);
        for (const e of edges) e.ctrl = e.ctrlNorm * minDim;
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (nodes.length === 0) buildGraph();
        updateScreenPositions();
      }

      function curvePoint(a, b, ctrl, u) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const L = Math.hypot(dx, dy) || 1;
        const px = -dy / L, py = dx / L;
        const cx = mx + px * ctrl, cy = my + py * ctrl;
        const omu = 1 - u;
        return [
          omu * omu * a.x + 2 * omu * u * cx + u * u * b.x,
          omu * omu * a.y + 2 * omu * u * cy + u * u * b.y,
        ];
      }

      function fireNode(idx, t, depth = 0) {
        if (depth > MAX_DEPTH) return;
        nodes[idx].fires.push(t);
        for (const ei of nodes[idx].outE) {
          if (Math.random() > PROP) continue;
          spikes.push({ ei, start: t, end: t + TRAVEL, depth: depth + 1 });
        }
      }

      let last = performance.now();
      function step(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const t = now / 1000;

        ctx.fillStyle = P.bg;
        ctx.fillRect(0, 0, w, h);

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = P.edge;
        ctx.lineWidth = 1.4;
        for (const e of edges) {
          const a = nodes[e.src], b = nodes[e.dst];
          ctx.beginPath();
          const [p0x, p0y] = curvePoint(a, b, e.ctrl, 0);
          ctx.moveTo(p0x, p0y);
          for (let u = 0.1; u <= 1; u += 0.1) {
            const [px, py] = curvePoint(a, b, e.ctrl, u);
            ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        spikes = spikes.filter(s => {
          if (t > s.end) { fireNode(edges[s.ei].dst, s.end, s.depth); return false; }
          return true;
        });

        ctx.lineWidth = 3.5;
        for (const s of spikes) {
          const e = edges[s.ei];
          const a = nodes[e.src], b = nodes[e.dst];
          const u = (t - s.start) / TRAVEL;
          const u0 = Math.max(0, u - 0.32);
          const [tailX, tailY] = curvePoint(a, b, e.ctrl, u0);
          const [headX, headY] = curvePoint(a, b, e.ctrl, u);
          const grad = ctx.createLinearGradient(tailX, tailY, headX, headY);
          grad.addColorStop(0.0, P.trail0);
          grad.addColorStop(0.55, P.trail1);
          grad.addColorStop(1.0, P.trail2);
          ctx.strokeStyle = grad;
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          for (let k = 1; k <= 12; k++) {
            const [px, py] = curvePoint(a, b, e.ctrl, u0 + (u - u0) * (k / 12));
            ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.fillStyle = P.spikeHead;
          ctx.beginPath();
          ctx.arc(headX, headY, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = P.compBlend;
        for (const n of nodes) {
          n.fires = n.fires.filter(ft => t - ft < FIRE_DECAY);
          for (const ft of n.fires) {
            const dt0 = t - ft;
            const falloff = Math.pow(1 - dt0 / FIRE_DECAY, 2);
            const size = Math.max(60, 130 - dt0 * 200);
            ctx.globalAlpha = 0.85 * falloff;
            ctx.drawImage(glowSprite, n.x - size / 2, n.y - size / 2, size, size);
          }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        for (const n of nodes) {
          let bright = 0;
          for (const ft of n.fires) bright = Math.max(bright, 1 - (t - ft) / FIRE_DECAY);
          const r = n.r + bright * 3.5;
          if (bright > 0) {
            ctx.fillStyle = `rgba(255, ${200 + bright * 30}, ${100 + bright * 80}, 1)`;
            ctx.strokeStyle = `rgba(180, 100, 30, ${0.7 + bright * 0.3})`;
          } else if (n.role === 'input') {
            ctx.fillStyle = P.inputFill;
            ctx.strokeStyle = P.inputStroke;
          } else {
            ctx.fillStyle = P.nodeFill;
            ctx.strokeStyle = P.nodeStroke;
          }
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        for (let i = 0; i < nodes.length; i++) {
          if (t >= nodes[i].nextFire) {
            fireNode(i, t);
            nodes[i].nextFire = t + (nodes[i].role === 'input' ? 3 : 6) * (0.5 + Math.random());
          }
        }
        if (Math.random() < SPONT_RATE * dt) fireNode(Math.floor(Math.random() * nodes.length), t);

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    }
  </script>
</body>
</html>
