<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #e8e6e1;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8vh 6vw;
      box-sizing: border-box;
      text-align: center;
    }
    .wordmark {
      position: fixed;
      top: 32px;
      left: 32px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6a6a6a;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(32px, 5.6vw, 72px);
      line-height: 1.15;
      max-width: 16ch;
      margin: 0 0 2.2em 0;
      color: #f5f3ee;
      letter-spacing: -0.01em;
    }
    p.thesis {
      max-width: 38ch;
      font-size: 15px;
      line-height: 1.7;
      color: #8c8a85;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #5a5a5a;
    }
  </style>
</head>
<body>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <h1>Intelligence is a process, not a function.</h1>
    <p class="thesis">
      Today's models memorize. They do not adapt. We are building intelligence as what it actually is &mdash; a dynamical system of units that remember, compute, and adapt.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>
  <script src="nav.js" defer></script>
</body>
</html>
