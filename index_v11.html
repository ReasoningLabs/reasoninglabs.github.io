<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #14171a;
      color: #d8dce0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.025) 0%, transparent 55%);
      z-index: 0;
    }
    .wordmark {
      position: fixed;
      top: 32px;
      left: 32px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7a8088;
      z-index: 3;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8vh 6vw;
      box-sizing: border-box;
      text-align: center;
    }
    .equation {
      font-style: italic;
      font-weight: 300;
      font-size: clamp(48px, 9vw, 128px);
      line-height: 1;
      letter-spacing: 0.01em;
      color: #f0f3f6;
      margin: 0 0 0.5em 0;
      white-space: nowrap;
    }
    .equation .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: 0.55em;
      margin: 0 0.18em;
      line-height: 1.05;
    }
    .equation .frac .num,
    .equation .frac .den {
      padding: 0 0.18em;
    }
    .equation .frac .num {
      border-bottom: 1.5px solid currentColor;
    }
    .equation .op { margin: 0 0.22em; }
    .caption {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a8088;
      margin: 0 0 4em 0;
    }
    h1 {
      font-style: italic;
      font-weight: 300;
      font-size: clamp(22px, 3vw, 32px);
      line-height: 1.3;
      max-width: 28ch;
      margin: 0 0 1em 0;
      color: #e8ecf0;
    }
    p.thesis {
      max-width: 50ch;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-style: normal;
      font-size: 12px;
      line-height: 1.85;
      color: #9099a0;
      margin: 0;
      letter-spacing: 0.02em;
    }
    footer {
      position: fixed;
      bottom: 32px;
      right: 32px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7a8088;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <div class="equation" aria-label="dx by dt equals f of x and theta">
      <span class="frac">
        <span class="num">dx</span>
        <span class="den">dt</span>
      </span>
      <span class="op">=</span>
      <span>&thinsp;f&hairsp;(x,&thinsp;&theta;)</span>
    </div>
    <p class="caption">Intelligence as a dynamical process</p>
    <h1>Not a function to be fitted &mdash; a system that remembers, computes, adapts.</h1>
    <p class="thesis">
      Frontier models memorize. They do not adapt. We are building intelligence as what it actually is.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>
  <script src="nav.js" defer></script>
</body>
</html>
