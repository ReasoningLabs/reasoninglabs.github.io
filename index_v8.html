<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #060814;
      color: #d8dce6;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 25% 30%, rgba(40,60,120,0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 75%, rgba(80,40,120,0.14) 0%, transparent 55%);
      z-index: 1;
    }
    .wordmark {
      position: fixed;
      top: 32px;
      left: 32px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b7286;
      z-index: 2;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8vh 6vw;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(32px, 5.4vw, 68px);
      line-height: 1.18;
      max-width: 18ch;
      margin: 0 0 2em 0;
      color: #f0f3fa;
      letter-spacing: -0.005em;
    }
    p.thesis {
      max-width: 40ch;
      font-size: 14px;
      line-height: 1.8;
      color: #8088a0;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 32px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b7286;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <h1>For superintelligence, we must first reinvent it.</h1>
    <p class="thesis">
      Intelligence is not a function. It is a dynamical process &mdash; small units that remember, compute, and adapt.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>

  <script src="nav.js" defer></script>
  <script>
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let w, h, dpr, points;
      const COUNT = 220;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function init() {
        points = [];
        for (let i = 0; i < COUNT; i++) {
          points.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.pow(Math.random(), 3) * 1.4 + 0.3,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 1.2,
            drift: (Math.random() - 0.5) * 0.05,
          });
        }
      }

      function step(t) {
        ctx.clearRect(0, 0, w, h);
        const time = t * 0.001;

        for (const p of points) {
          p.x += p.drift;
          if (p.x < 0) p.x += w;
          if (p.x > w) p.x -= w;
          const tw = 0.55 + 0.45 * Math.sin(time * p.speed + p.phase);
          ctx.fillStyle = `rgba(220, 230, 250, ${tw * 0.85})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = 'rgba(160, 180, 220, 0.06)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < points.length; i++) {
          for (let j = i + 1; j < points.length; j++) {
            const a = points[i], b = points[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 14000 && Math.random() < 0.6) {
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', () => { resize(); init(); });
      resize();
      init();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
