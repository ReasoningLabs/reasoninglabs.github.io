<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff8ee;
      font-family: 'Raleway', system-ui, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .wordmark {
      position: fixed;
      top: 36px;
      left: 56px;
      font-weight: 100;
      font-size: 13px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 248, 238, 0.85);
      z-index: 5;
    }
    .corner-meta {
      position: fixed;
      top: 36px;
      right: 56px;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 200, 80, 0.78);
      z-index: 5;
      text-align: right;
      line-height: 1.7;
    }
    .stage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    .orbs {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 0;
      transform: translateY(0);
    }
    .orb {
      position: absolute;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      background: radial-gradient(circle at 36% 30%,
        rgba(255, 250, 235, 1) 0%,
        rgba(255, 232, 188, 0.95) 22%,
        rgba(255, 200, 120, 0.65) 48%,
        rgba(255, 170,  70, 0.18) 78%,
        rgba(255, 160,  60, 0) 100%);
      box-shadow:
        0 0 60px rgba(255, 200, 80, 0.42),
        0 0 140px rgba(255, 200, 80, 0.18),
        inset -8px -10px 28px rgba(190, 90, 20, 0.35);
      animation: appear 0.45s ease-out forwards;
    }
    @keyframes appear {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      to   { opacity: var(--a, 1); transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes breathe {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.08); }
    }

    .headline {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
      text-align: center;
      padding: 0 8vw;
    }
    .headline h1 {
      font-weight: 200;
      font-size: clamp(28px, 4.4vw, 64px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 240, 210, 0.98);
      margin: 0;
      max-width: 22ch;
      line-height: 1.25;
      opacity: 0;
      animation: fadeIn 1.6s ease 1.6s forwards;
      text-shadow:
        0 0 32px rgba(255, 200, 80, 0.55),
        0 0 70px rgba(0, 0, 0, 0.95),
        0 0 140px rgba(0, 0, 0, 0.85);
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .signature {
      position: fixed;
      bottom: 36px;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 300;
      font-size: clamp(16px, 1.6vw, 22px);
      letter-spacing: 0.18em;
      color: rgba(255, 248, 238, 0.85);
      z-index: 5;
      opacity: 0;
      animation: fadeIn 1.2s ease 3.0s forwards;
    }
    .footer-meta {
      position: fixed;
      bottom: 36px;
      left: 56px;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 248, 238, 0.55);
      z-index: 5;
    }
    .footer-meta-right {
      position: fixed;
      bottom: 36px;
      right: 56px;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 248, 238, 0.55);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="wordmark">Reasoning Labs</div>
  <div class="corner-meta">Implicit adaptive reasoning<br>and self-control</div>

  <div class="stage">
    <div class="orbs" id="orbs"></div>
  </div>

  <div class="headline"><h1>The next era of intelligence</h1></div>

  <div class="signature">valters@reasoninglabs.com</div>
  <div class="footer-meta">Valters Zakrevskis</div>
  <div class="footer-meta-right">MMXXVI</div>

  <script src="nav.js" defer></script>
  <script>
    (function () {
      const offsets = [0, 5, 12, 21, 32, 45, 60, 77, 96, 117];
      const span = offsets[offsets.length - 1];
      const startPct = 14;
      const endPct = 92;
      const orbs = document.getElementById('orbs');

      offsets.forEach((off, i) => {
        const t = i / (offsets.length - 1);
        const xPct = startPct + (off / span) * (endPct - startPct);
        const size = 240 * (1 - t * 0.78);
        const alpha = 1 - Math.pow(t, 0.85) * 0.85;
        const delay = i * 0.13;

        const el = document.createElement('div');
        el.className = 'orb';
        el.style.left = xPct + '%';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.setProperty('--a', alpha.toFixed(3));
        el.style.animationDelay = delay + 's';
        if (i === 0) {
          el.style.animation = `appear 0.7s ease-out forwards, breathe 5s ease-in-out 1s infinite`;
        }
        orbs.appendChild(el);
      });
    })();
  </script>
</body>
</html>
