<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f7f6f2;
      color: #0a0a0a;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }
    .wordmark {
      position: fixed;
      top: 28px;
      left: 32px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #0a0a0a;
      z-index: 2;
    }
    .index {
      position: fixed;
      top: 28px;
      right: 32px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #0a0a0a;
      z-index: 2;
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      padding: 14vh 6vw 16vh;
      box-sizing: border-box;
    }
    h1 {
      font-weight: 900;
      font-size: clamp(54px, 12vw, 180px);
      line-height: 0.92;
      letter-spacing: -0.04em;
      margin: 0;
      color: #0a0a0a;
    }
    h1 .red {
      color: #d83a2a;
    }
    h1 .stack {
      display: block;
    }
    .meta {
      margin-top: 4vh;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 6vw;
      flex-wrap: wrap;
    }
    .thesis {
      max-width: 42ch;
      font-size: 16px;
      line-height: 1.55;
      color: #1a1a1a;
      margin: 0;
      font-weight: 400;
    }
    .signature {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #0a0a0a;
      font-weight: 700;
      white-space: nowrap;
    }
    footer {
      position: fixed;
      bottom: 28px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6a6a6a;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="wordmark">Reasoning Labs</div>
  <div class="index">001 / Manifesto</div>
  <main>
    <h1>
      <span class="stack">Reinventing</span>
      <span class="stack"><span class="red">Intelligence.</span></span>
    </h1>
    <div class="meta">
      <p class="thesis">
        Today's models memorize. They do not adapt. We are building intelligence as what it actually is &mdash; a dynamical process composed of small units that remember, compute, and adapt.
      </p>
      <div class="signature">&mdash; Valters Zakrevskis</div>
    </div>
  </main>
  <footer>
    <span>MMXXVI</span>
    <span>From the ground up</span>
  </footer>
  <script src="nav.js" defer></script>
</body>
</html>
