<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff8ee;
      font-family: 'Raleway', system-ui, sans-serif;
      font-weight: 200;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#net {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .wordmark {
      position: fixed;
      top: 36px;
      left: 56px;
      font-weight: 100;
      font-size: 13px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 248, 238, 0.85);
      z-index: 3;
    }
    .tagline {
      position: fixed;
      top: 80px;
      left: 56px;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 200, 80, 0.78);
      z-index: 3;
      max-width: 28ch;
      line-height: 1.7;
    }
    .footer-text {
      position: fixed;
      left: 56px;
      bottom: 36px;
      max-width: 38ch;
      font-weight: 200;
      font-size: 13px;
      line-height: 1.85;
      color: rgba(255, 248, 238, 0.65);
      letter-spacing: 0.02em;
      z-index: 3;
    }
    .signature {
      position: fixed;
      right: 56px;
      bottom: 36px;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 248, 238, 0.55);
      z-index: 3;
    }
  </style>
</head>
<body>
  <canvas id="net"></canvas>

  <div class="wordmark">Reasoning Labs</div>
  <div class="tagline">Implicit adaptive reasoning<br>and self-control</div>

  <div class="footer-text">
    Memory. Computation. Adaptation. The smallest object that, composed into larger systems, produces reasoning &mdash; and corrects itself.
  </div>
  <div class="signature">Valters Zakrevskis</div>

  <script src="nav.js" defer></script>
  <script>
    (function () {
      const canvas = document.getElementById('net');
      const ctx = canvas.getContext('2d');
      let w, h, dpr;

      const N_NODES = 38;
      const NEAR_K = 3;
      const TRAVEL = 0.55;
      const FIRE_DECAY = 0.34;
      const SPONT_RATE = 0.22;
      const PROP = 0.55;
      const MAX_DEPTH = 5;

      const GLOW_SIZE = 256;
      const glowSprite = (() => {
        const off = document.createElement('canvas');
        off.width = GLOW_SIZE; off.height = GLOW_SIZE;
        const gc = off.getContext('2d');
        const cx = GLOW_SIZE / 2;
        const grad = gc.createRadialGradient(cx, cx, 0, cx, cx, cx);
        grad.addColorStop(0.00, 'rgba(255, 220, 130, 1.0)');
        grad.addColorStop(0.18, 'rgba(255, 200,  80, 0.55)');
        grad.addColorStop(0.50, 'rgba(255, 200,  80, 0.12)');
        grad.addColorStop(1.00, 'rgba(255, 200,  80, 0.0)');
        gc.fillStyle = grad;
        gc.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);
        return off;
      })();

      let nodes = [];
      let edges = [];
      let spikes = [];

      function buildGraph() {
        nodes = [];
        for (let i = 0; i < N_NODES; i++) {
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 5 + Math.random() * 2.5,
            role: Math.random() < 0.18 ? 'input' : 'inner',
            fires: [],
            nextFire: 0.5 + Math.random() * 6,
            outE: [],
          });
        }

        edges = [];
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          const others = nodes
            .map((n, j) => ({ j, d2: (n.x - a.x) ** 2 + (n.y - a.y) ** 2 }))
            .filter(o => o.j !== i)
            .sort((x, y) => x.d2 - y.d2)
            .slice(0, NEAR_K + Math.floor(Math.random() * 2));

          for (const o of others) {
            if (Math.random() < 0.55) {
              const e = {
                src: i, dst: o.j,
                ctrl: (Math.random() - 0.5) * 50,
              };
              edges.push(e);
              a.outE.push(edges.length - 1);
            }
          }
        }
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildGraph();
      }

      function curvePoint(a, b, ctrl, u) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const L = Math.hypot(dx, dy) || 1;
        const px = -dy / L, py = dx / L;
        const cx = mx + px * ctrl, cy = my + py * ctrl;
        const omu = 1 - u;
        return [
          omu * omu * a.x + 2 * omu * u * cx + u * u * b.x,
          omu * omu * a.y + 2 * omu * u * cy + u * u * b.y,
        ];
      }

      function fireNode(idx, t, depth = 0) {
        if (depth > MAX_DEPTH) return;
        const n = nodes[idx];
        n.fires.push(t);
        for (const ei of n.outE) {
          if (Math.random() > PROP) continue;
          spikes.push({
            ei, start: t, end: t + TRAVEL, depth: depth + 1,
          });
        }
      }

      let last = performance.now();
      function step(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const t = now / 1000;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255, 248, 238, 0.10)';
        ctx.lineWidth = 1.4;
        for (const e of edges) {
          const a = nodes[e.src], b = nodes[e.dst];
          ctx.beginPath();
          const [p0x, p0y] = curvePoint(a, b, e.ctrl, 0);
          ctx.moveTo(p0x, p0y);
          for (let u = 0.1; u <= 1; u += 0.1) {
            const [px, py] = curvePoint(a, b, e.ctrl, u);
            ctx.lineTo(px, py);
          }
          ctx.stroke();
        }

        spikes = spikes.filter(s => {
          if (t > s.end) {
            fireNode(edges[s.ei].dst, s.end, s.depth);
            return false;
          }
          return true;
        });

        ctx.lineWidth = 3.5;
        for (const s of spikes) {
          const e = edges[s.ei];
          const a = nodes[e.src], b = nodes[e.dst];
          const u = (t - s.start) / TRAVEL;
          const u0 = Math.max(0, u - 0.32);
          const [tailX, tailY] = curvePoint(a, b, e.ctrl, u0);
          const [headX, headY] = curvePoint(a, b, e.ctrl, u);
          const grad = ctx.createLinearGradient(tailX, tailY, headX, headY);
          grad.addColorStop(0.0, 'rgba(255, 200, 80, 0)');
          grad.addColorStop(0.55, 'rgba(255, 200, 80, 0.32)');
          grad.addColorStop(1.0, 'rgba(255, 220, 130, 0.95)');
          ctx.strokeStyle = grad;
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          for (let k = 1; k <= 12; k++) {
            const [px, py] = curvePoint(a, b, e.ctrl, u0 + (u - u0) * (k / 12));
            ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.fillStyle = 'rgba(255, 230, 160, 0.95)';
          ctx.beginPath();
          ctx.arc(headX, headY, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalCompositeOperation = 'lighter';
        for (const n of nodes) {
          n.fires = n.fires.filter(ft => t - ft < FIRE_DECAY);
          for (const ft of n.fires) {
            const dt0 = t - ft;
            const falloff = Math.pow(1 - dt0 / FIRE_DECAY, 2);
            const size = Math.max(60, 130 - dt0 * 200);
            ctx.globalAlpha = 0.85 * falloff;
            ctx.drawImage(glowSprite, n.x - size / 2, n.y - size / 2, size, size);
          }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        for (const n of nodes) {
          let bright = 0;
          for (const ft of n.fires) {
            bright = Math.max(bright, 1 - (t - ft) / FIRE_DECAY);
          }
          const r = n.r + bright * 3.5;
          if (bright > 0) {
            ctx.fillStyle = `rgba(255, ${230 - bright * 5}, ${130 + bright * 60}, 1)`;
            ctx.strokeStyle = `rgba(255, 240, 200, ${0.6 + bright * 0.4})`;
          } else if (n.role === 'input') {
            ctx.fillStyle = 'rgba(170, 230, 255, 0.78)';
            ctx.strokeStyle = 'rgba(200, 240, 255, 0.92)';
          } else {
            ctx.fillStyle = 'rgba(255, 200, 80, 0.78)';
            ctx.strokeStyle = 'rgba(255, 230, 130, 0.92)';
          }
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          if (t >= n.nextFire) {
            fireNode(i, t);
            n.nextFire = t + (n.role === 'input' ? 3 : 6) * (0.5 + Math.random());
          }
        }
        if (Math.random() < SPONT_RATE * dt) {
          fireNode(Math.floor(Math.random() * nodes.length), t);
        }

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
