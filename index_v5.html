<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #050507;
      color: #e8e6e1;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#breath {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 55%, rgba(5,5,7,0.92) 100%);
      z-index: 1;
    }
    .wordmark {
      position: fixed;
      top: 32px;
      left: 32px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6a6a6a;
      z-index: 2;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8vh 6vw;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-weight: 200;
      font-size: clamp(26px, 4vw, 48px);
      line-height: 1.25;
      max-width: 22ch;
      margin: 0 0 1.6em 0;
      color: #f0eeea;
      letter-spacing: 0.005em;
    }
    p.thesis {
      max-width: 42ch;
      font-size: 14px;
      line-height: 1.8;
      color: #8c8a85;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 32px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6a6a6a;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="breath"></canvas>
  <div class="vignette"></div>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <h1>Adaptation is the substrate of intelligence.</h1>
    <p class="thesis">
      Not memorized knowledge. Not fitted functions. A process &mdash; remembering, computing, correcting itself.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>

  <script src="nav.js" defer></script>
  <script>
    (function () {
      const canvas = document.getElementById('breath');
      const ctx = canvas.getContext('2d');
      let w, h, dpr;
      const RINGS = 6;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function step(t) {
        ctx.clearRect(0, 0, w, h);
        const cx = w / 2;
        const cy = h / 2;
        const baseR = Math.min(w, h) * 0.22;
        const time = t * 0.0006;

        for (let i = 0; i < RINGS; i++) {
          const phase = time + i * 0.55;
          const breath = (Math.sin(phase) + 1) / 2;
          const r = baseR + breath * baseR * 1.6 + i * 14;
          const alpha = (1 - i / RINGS) * 0.22 * (0.4 + breath * 0.6);

          ctx.beginPath();
          const segs = 220;
          for (let s = 0; s <= segs; s++) {
            const a = (s / segs) * Math.PI * 2;
            const wob = Math.sin(a * 5 + time * 1.3 + i) * 4
                      + Math.sin(a * 3 - time * 0.7 + i * 0.4) * 6;
            const rr = r + wob;
            const x = cx + Math.cos(a) * rr;
            const y = cy + Math.sin(a) * rr;
            if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(190, 200, 215, ${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
