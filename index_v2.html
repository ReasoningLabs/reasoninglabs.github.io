<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reasoning Labs</title>
  <meta name="description" content="Reasoning Labs">
  <link rel="canonical" href="https://reasoninglabs.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #060608;
      color: #e8e6e1;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(6,6,8,0.85) 100%);
      z-index: 1;
    }
    .wordmark {
      position: fixed;
      top: 32px;
      left: 32px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a7a7a;
      z-index: 2;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 8vh 8vw;
      box-sizing: border-box;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(28px, 4.4vw, 56px);
      line-height: 1.2;
      max-width: 20ch;
      margin: 0 0 1.5em 0;
      color: #f5f3ee;
      letter-spacing: -0.01em;
    }
    p.thesis {
      max-width: 44ch;
      font-size: 15px;
      line-height: 1.75;
      color: #9b9994;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 32px;
      right: 32px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6a6a6a;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <div class="wordmark">Reasoning Labs</div>
  <main>
    <h1>Knowledge is not intelligence.</h1>
    <p class="thesis">
      Intelligence is not a function to be fitted. It is a dynamical process &mdash; small units that remember, compute, and adapt; together producing reasoning that corrects itself.
    </p>
  </main>
  <footer>Valters Zakrevskis</footer>

  <script src="nav.js" defer></script>
  <script>
    (function () {
      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d');
      let w, h, dpr, nodes;
      const COUNT = 90;
      const LINK_DIST = 160;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        w = canvas.clientWidth = window.innerWidth;
        h = canvas.clientHeight = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function init() {
        nodes = [];
        for (let i = 0; i < COUNT; i++) {
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
            r: Math.random() * 1.4 + 0.4,
          });
        }
      }

      function step() {
        ctx.clearRect(0, 0, w, h);

        for (const n of nodes) {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
        }

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < LINK_DIST) {
              const alpha = (1 - d / LINK_DIST) * 0.18;
              ctx.strokeStyle = `rgba(200, 210, 220, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        for (const n of nodes) {
          ctx.fillStyle = 'rgba(220, 225, 230, 0.55)';
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', () => { resize(); init(); });
      resize();
      init();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
